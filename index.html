<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТЕЛЕстудия ЛИС - Учёт посещений</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>ТЕЛЕстудия ЛИС</h1>
            <p>Система учёта посещений</p>
        </header>
        <main>
            <div class="buttons">
                <button id="check-in-button">Отметиться</button>
                <button id="view-attendance-button">Посмотреть посещения</button>
            </div>

            <!-- QR-код -->
            <div id="qr-code" class="hidden">
                <p>Сканируйте QR-код:</p>
                <img src="https://via.placeholder.com/200?text=QR+Code" alt="QR Code">
                <form id="name-form" class="hidden">
                    <input type="text" id="first-name" placeholder="Имя" required>
                    <input type="text" id="last-name" placeholder="Фамилия" required>
                    <button type="submit">Отметиться</button>
                </form>
            </div>

            <!-- Таблица посещений -->
            <div id="attendance-table" class="hidden">
                <h2>Список посещений</h2>
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Имя</th>
                            <th>Фамилия</th>
                            <th>Дата и время</th>
                        </tr>
                    </thead>
                    <tbody id="attendance-records">
                        <!-- Строки таблицы будут добавляться динамически -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
