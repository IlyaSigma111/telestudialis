<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТЕЛЕстудия ЛИС - Учёт посещений</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Главный экран -->
        <div id="main-screen">
            <header>
                <h1>📺 ТЕЛЕстудия ЛИС</h1>
                <p>Добро пожаловать в систему учёта посещений!</p>
            </header>
            <div class="buttons">
                <button id="check-in-button">✅ Отметиться</button>
                <button id="view-attendance-button">📋 Посмотреть отметки</button>
            </div>
        </div>

        <!-- Экран "Отметиться" -->
        <div id="check-in-screen" class="hidden">
            <h2>Сканируйте QR-код</h2>
            <img id="qr-image" src="https://via.placeholder.com/300?text=QR+Code" alt="QR Code">
            <form id="name-form">
                <input type="text" id="first-name" placeholder="Имя" required>
                <input type="text" id="last-name" placeholder="Фамилия" required>
                <button type="submit">💾 Сохранить</button>
            </form>
            <button id="back-to-main-from-checkin">🔙 Назад</button>
        </div>

        <!-- Экран "Посмотреть отметки" -->
        <div id="attendance-screen" class="hidden">
            <h2>Посещения</h2>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Имя</th>
                        <th>Фамилия</th>
                        <th>Дата и время</th>
                    </tr>
                </thead>
                <tbody id="attendance-records">
                    <!-- Данные появятся автоматически -->
                </tbody>
            </table>
            <button id="back-to-main-from-attendance">🔙 Назад</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
