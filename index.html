<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учет посещений - ТЕЛЕстудия ЛИС</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Главная страница -->
        <div id="main-screen">
            <header>
                <h1>Учет посещений</h1>
                <p>ТЕЛЕстудия ЛИС</p>
            </header>
            <div class="buttons">
                <button onclick="showCheckInScreen()">Отметиться</button>
                <button onclick="showAttendanceScreen()">Посмотреть отметки</button>
            </div>
        </div>

        <!-- Экран отметки -->
        <div id="check-in-screen">
            <header>
                <h1>Отметиться</h1>
                <p>Введите ваше имя</p>
            </header>
            <form onsubmit="markAttendance(event)">
                <input type="text" id="name" placeholder="Введите имя" required>
                <button type="submit">Отметиться</button>
            </form>
            <button onclick="backToMain()">Вернуться на главную</button>
        </div>

        <!-- Экран посещений -->
        <div id="attendance-screen">
            <header>
                <h1>Посещение</h1>
                <p>Посмотреть отметки</p>
            </header>
            <table>
                <thead>
                    <tr>
                        <th>Имя</th>
                        <th>Дата</th>
                    </tr>
                </thead>
                <tbody id="attendance-table-body">
                    <!-- Данные будут отображаться здесь -->
                </tbody>
            </table>
            <button onclick="backToMain()">Вернуться на главную</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
